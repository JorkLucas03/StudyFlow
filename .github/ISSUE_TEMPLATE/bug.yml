name: Reporte de error
description: Informa un problema reproducible en StudyFlow.
title: "[Error]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar el problema. Mientras mas claro sea el contexto, mas facil sera corregirlo.
  - type: input
    id: resumen
    attributes:
      label: Resumen
      description: Describe el error en una frase.
      placeholder: El plan no se guarda cuando...
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Indica exactamente que hiciste antes de ver el error.
      placeholder: |
        1. Abrir la app
        2. Completar materia y temas
        3. Presionar Crear plan
    validations:
      required: true
  - type: textarea
    id: resultado_esperado
    attributes:
      label: Resultado esperado
      description: Que esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: resultado_actual
    attributes:
      label: Resultado actual
      description: Que ocurrio realmente.
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador o entorno
      placeholder: Chrome, Firefox, movil, local, Cloud Run...
    validations:
      required: false
